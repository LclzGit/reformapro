name: Atualizar Legislação

on:
  # Agendamento automático DESATIVADO — reativar manualmente quando necessário
  # schedule:
  #   - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Fontes a atualizar (all | lcp214 lcp227 reg_cbs)'
        required: false
        default: 'all'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install beautifulsoup4 lxml

      - name: Arquivar versão atual
        run: |
          DATE=$(date +%Y-%m-%d)
          DIR="versions/$DATE"
          mkdir -p "$DIR"
          for f in lcp214.json lcp227.json reg_cbs.json reg_ibs.json; do
            [ -f "$f" ] && cp "$f" "$DIR/$f"
          done
          # Manter apenas as últimas 20 versões
          ls -1d versions/20*/ 2>/dev/null | sort | head -n -20 | xargs -r rm -rf
          echo "Arquivado em $DIR"

      - name: Buscar e parsear leis
        run: |
          SOURCES="${{ github.event.inputs.sources || 'all' }}"
          python3 scripts/fetch_laws.py $SOURCES || {
            echo "::error::fetch_laws.py falhou — encoding corrompido ou parsing inválido. Nenhum arquivo foi sobrescrito."
            exit 1
          }
        timeout-minutes: 10

      - name: Verificar mudanças reais nos artigos
        id: check_changes
        run: |
          python3 - <<'EOF'
          import json, hashlib, os, sys
          from pathlib import Path

          files = ['lcp214.json', 'lcp227.json', 'reg_cbs.json']
          changed = []

          for fname in files:
              path = Path(fname)
              if not path.exists():
                  continue

              # Hash apenas dos textos dos artigos (ignora formatação/ordem dos campos JSON)
              new_data = json.loads(path.read_text(encoding='utf-8'))
              new_hash = hashlib.sha256(
                  '\n'.join(f"{c['a']}::{c['t']}" for c in new_data).encode()
              ).hexdigest()

              # Compara com hash salvo da última versão aceita
              hash_file = Path(f'scripts/.hash_{fname}')
              old_hash = hash_file.read_text().strip() if hash_file.exists() else ''

              if new_hash != old_hash:
                  changed.append(fname)
                  hash_file.write_text(new_hash)
                  print(f'  MUDANÇA DETECTADA: {fname} (hash {old_hash[:8] or "novo"} → {new_hash[:8]})')
              else:
                  print(f'  Sem mudança: {fname} (hash {new_hash[:8]})')

          with open('/tmp/changed_files.txt', 'w') as f:
              f.write('\n'.join(changed))

          if changed:
              print(f'\nArquivos com mudança real: {changed}')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                  fh.write('changed=true\n')
          else:
              print('\nNenhum artigo alterado — legislação sem mudanças.')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                  fh.write('changed=false\n')
          EOF

      - name: Reconstruir index.html
        if: steps.check_changes.outputs.changed == 'true'
        run: python3 scripts/build_index.py

      - name: Commit e push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Adiciona JSONs alterados, versão arquivada e index.html
          git add '*.json' versions/ scripts/*_structure.json scripts/.hash_*.json index.html
          git diff --cached --quiet && echo "Nada para commitar." && exit 0

          DATE=$(date +%Y-%m-%d)
          CHANGED=$(cat /tmp/changed_files.txt | tr '\n' ' ')
          git commit -m "auto: atualiza legislação ($DATE)

          Fontes atualizadas: $CHANGED
          Versão anterior arquivada em versions/$DATE/"

          git push origin main
          echo "✅ Publicado no GitHub Pages"

      - name: Sem mudanças
        if: steps.check_changes.outputs.changed == 'false'
        run: echo "✅ Legislação já está atualizada — nenhuma publicação necessária."
